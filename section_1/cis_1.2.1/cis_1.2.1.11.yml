---

{{ if .Vars.ubtu26cis_level_1 }}
  {{ if .Vars.ubtu26cis_rule_1_2_1_11 }}
command:
  apt_sources_list_d_https:
    title: 1.2.1.11 | Ensure repositories are set to https in /etc/apt/sources.list.d directory
    exit-status: 0
    exec: grep -Ps -- '^\s*(deb(-src)?\s+http://|URIs:\s+http://)' /etc/apt/sources.list.d/* 2>/dev/null ; true
    stdout:
    - '/^$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID: 1.2.1.11
      NIST800-53R5: SC-8
  {{ end }}
{{ end }}
