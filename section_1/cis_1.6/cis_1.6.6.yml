---

{{ if .Vars.ubtu26cis_level_1 }}
  {{ if .Vars.ubtu26cis_rule_1_6_6 }}
command:
  motd_permissions:
    title: 1.6.6 | Ensure access to /etc/motd is configured
    exec: |
      for l_file in /etc/motd /run/motd /usr/lib/motd /etc/motd.d/* /run/motd.d/* /usr/lib/motd.d/* /etc/update-motd.d/*; do
        [ -e "$l_file" ] || continue
        set -- $(stat -Lc '%#a %u %g' "$l_file")
        case "$l_file" in
          /etc/update-motd.d/*) l_mask=07022 ;;
          *) l_mask=07133 ;;
        esac
        [ $(( $1 & l_mask )) -eq 0 ] || echo "FAIL: $l_file mode is $1"
        { [ "$2" = "0" ] && [ "$3" = "0" ]; } || echo "FAIL: $l_file uid:gid is $2:$3"
      done
      echo "scan_done"
    exit-status: 0
    stdout:
    - '/^scan_done$/'
    - '!/^FAIL:/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.6.6
      NIST800-53R5:
      - CM-6
      - CM-1
      - CM-3
  {{ end }}
{{ end }}
