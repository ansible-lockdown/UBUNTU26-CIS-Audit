---

{{ if .Vars.ubtu26cis_level_1 }}
  {{ if .Vars.ubtu26cis_rule_1_6_9 }}
command:
  pam_motd_perms:
    title: 1.6.9 | Ensure access to pam_motd file is configured
    exec: grep -hPo 'motd=\K\S+' /etc/pam.d/* 2>/dev/null | sort -u | xargs -r stat -Lc '%n %a %U %G' 2>/dev/null | awk '$2 !~ /^[0-6][0-4][0-4]$/ || $3 != "root" || $4 != "root"' ; true
    exit-status: 0
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: 1
      CIS_ID: 1.6.9
      NIST800-53R5:
      - CM-6
      - CM-1
      - CM-3
  {{ end }}
{{ end }}
