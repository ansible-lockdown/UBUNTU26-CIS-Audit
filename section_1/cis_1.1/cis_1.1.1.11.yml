---

{{ if .Vars.ubtu26cis_level_1 }}
  {{ if .Vars.ubtu26cis_rule_1_1_1_11 }}
command:
  cve_fs:
    title: 1.1.1.11 | Ensure unused filesystems kernel modules are not available
    exit-status: 0
    exec: f="{{ .Vars.ubtu26cis_temp_exec_location }}/fs_with_cves.sh"; if [ -x "$f" ]; then "$f"; else echo "fs_with_cves.sh not present - run the role or review kernel modules manually"; exit 1; fi
    stdout:
    - '!/.*<- CVE exists!/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.1.1.11
      NIST800-53R5: NA
      CCI: NA
  {{ end }}
{{ end }}
