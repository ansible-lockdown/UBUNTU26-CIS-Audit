---

{{ if .Vars.ubtu26cis_level_1 }}
    {{ if .Vars.ubtu26cis_rule_1_7_5 }}
file:
  gdm_autorun_never:
    title: 1.7.5 | Ensure GDM autorun-never is configured
    skip: {{ if (not .Vars.ubtu26cis_desktop_required) }}true{{ else }}false{{ end }}
    skip-reason: ubtu26cis_desktop_required is false, no GNOME desktop on this host
    path: /etc/dconf/db/{{ .Vars.ubtu26cis_dconf_db_name }}.d/00-media-autorun
    exists: true
    contents:
    - '/^\[org\/gnome\/desktop\/media-handling\]/'
    - '/^autorun-never=true/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.7.5
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  gdm_autorun_lock:
    title: 1.7.5 | Ensure GDM autorun-never is configured | lock override
    skip: {{ if (not .Vars.ubtu26cis_desktop_required) }}true{{ else }}false{{ end }}
    skip-reason: ubtu26cis_desktop_required is false, no GNOME desktop on this host
    path: /etc/dconf/db/{{ .Vars.ubtu26cis_dconf_db_name }}.d/locks/00-autorun_lock
    exists: true
    contents:
    - '/org/gnome/desktop/media-handling/autorun-never'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.7.5
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
    {{ end }}
{{ end }}
