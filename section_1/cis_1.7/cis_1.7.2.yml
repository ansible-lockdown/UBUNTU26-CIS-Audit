---

{{ if .Vars.ubtu26cis_level_1 }}
    {{ if .Vars.ubtu26cis_rule_1_7_2 }}
command:
  gdm_disable_user:
    title: 1.7.2 | Ensure GDM disable-user-list is configured
    skip: {{ if (not .Vars.ubtu26cis_desktop_required) }}true{{ else }}false{{ end }}
    skip-reason: ubtu26cis_desktop_required is false, no GNOME desktop on this host
    exec: grep -Es "^disable-user-list" /etc/dconf/db/{{ .Vars.ubtu26cis_dconf_db_name }}.d/00-login-screen
    exit-status: 0
    stdout:
    - '/^disable-user-list=true/'
    - '!/^disable-user-list=false/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.7.2
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
    {{ end }}
{{ end }}
