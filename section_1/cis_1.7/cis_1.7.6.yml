---

{{ if .Vars.ubtu26cis_level_1 }}
    {{ if .Vars.ubtu26cis_rule_1_7_6 }}
file:
  gdm_xdcmp:
    title: 1.7.6 | Ensure XDMCP is not enabled
    skip: {{ if (not .Vars.ubtu26cis_desktop_required) }}true{{ else }}false{{ end }}
    skip-reason: ubtu26cis_desktop_required is false, no GNOME desktop on this host
    path: /etc/gdm3/custom.conf
    exists: true
    contents:
    - '!/^\s*Enable\s*=\s*true/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.7.6
      NIST800-53R5: SI-4
    {{ end }}
{{ end }}
