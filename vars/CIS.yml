ubtu26cis_ldap_server: false
ubtu26cis_ldap_mask: false
ubtu26cis_message_server: false  # This is for messaging dovecot and dovecot-pop3
ubtu26cis_message_mask: false
ubtu26cis_nfs_server: true
ubtu26cis_nfs_mask: true
ubtu26cis_nis_server: true  # set to mask if nis client required
ubtu26cis_nis_mask: false
ubtu26cis_print_server: false  # replaces cups
ubtu26cis_print_mask: false
ubtu26cis_rpc_server: true
ubtu26cis_rpc_mask: true
ubtu26cis_rsync_server: false
ubtu26cis_rsync_mask: false
ubtu26cis_samba_server: false
ubtu26cis_samba_mask: false
ubtu26cis_snmp_server: false
ubtu26cis_snmp_mask: false
ubtu26cis_telnet_server: false
ubtu26cis_telnet_mask: false
ubtu26cis_tftp_server: false
ubtu26cis_tftp_mask: false
ubtu26cis_squid_server: false
ubtu26cis_squid_mask: false
ubtu26cis_apache2_server: false
ubtu26cis_apache2_mask: false
ubtu26cis_nginx_server: false
ubtu26cis_nginx_mask: false
