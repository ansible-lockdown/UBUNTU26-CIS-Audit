# Client Services
ubtu26cis_nis_client_required: false  # Same package as NIS server
ubtu26cis_rsh_client: false
ubtu26cis_talk_client: false
ubtu26cis_telnet_required: false
ubtu26cis_ldap_clients_required: false
ubtu26cis_ftp_client: false

## Control 2.3.1.1
# This variable choses the tool used for time synchronization
# The two options are `chrony`and `systemd-timesyncd`.
ubtu26cis_time_sync_tool: "chrony"

## Controls 2.3.x - Configure time pools & servers for chrony and timesyncd
# The following variable represents a list of of time server pools used
# for configuring chrony and timesyncd.
# Each list item contains two settings, `name` (the domain name of the pool) and synchronization `options`.
# The default setting for the `options` is `iburst maxsources 4` -- please refer to the documentation
# of the time synchronization mechanism you are using.
ubtu26cis_time_pool:
  - name: time.nist.gov
    options: iburst maxsources 4

# The following variable represents a list of of time servers used
# for configuring chrony and timesyncd
# Each list item contains two settings, `name` (the domain name of the server) and synchronization `options`.
# The default setting for the `options` is `iburst` -- please refer to the documentation
# of the time synchronization mechanism you are using.
ubtu26cis_time_servers:
  - name: time-a-g.nist.gov
    options: iburst
  - name: time-b-g.nist.gov
    options: iburst
  - name: time-c-g.nist.gov
    options: iburst

# Section 3
## Control 3.1.1 - Ensure system is checked to determine if IPv6 is enabled
# This variable governs the mechanism of how the disabling of IPV6 is carried out.
# Its possible values are `grub` and `sysctl`.
ubtu26cis_ipv6_disable: grub

## Control 3.1.3 - Ensure bluetooth Services are not in use
# This control managed how the bluetooth service is managaed
# Options are
# true to leave installed if exists not changes take place
# false - this removes the package
# mask - if a dependancy for product so cannot be removed
ubtu26cis_bluetooth_service: false
ubtu26cis_bluetooth_mask: false

## Control 3.3.x - Networking configuration
# This variable contains the path to the file in which, sysctl saves its configurations.
# Its default value is `/etc/sysctl.conf`.
ubtu26cis_sysctl_network_conf: /etc/sysctl.d/97_cis_network.conf

#
### Section 4 - Host Based Firewall (UFW only)
#
# This benchmark covers UFW only; nftables and iptables are not in scope.
ubtu26cis_ufw_use_sysctl: true

## auditd settings
ubtu26cis_auditd_space_left_action: email
ubtu26cis_auditd_admin_space_left_action: halt
ubtu26cis_auditd_max_log_file_action: keep_logs
ubtu26cis_auditd_back_log_limit: 8192

## syslog
# Set which syslog service
# journald or rsyslog
ubtu26cis_syslog_service: 'journald'
ubtu26cis_system_is_log_server: false

### Section 5
# Note the following to understand precedence and layout

ubtu26cis_sshd_allow_users: 'AllowUsers'
ubtu26cis_sshd_allow_groups: 'AllowGroups'
ubtu26cis_sshd_deny_users: 'DenyUsers'
ubtu26cis_sshd_deny_groups: 'DenyGroups'

ubtu26cis_sshd_client_alive_interval: 15
ubtu26cis_sshd_client_alive_count_max: 3

# logins.def password settings
ubtu26cis_pass_max_days: 365
ubtu26cis_pass_min_days: 1
ubtu26cis_pass_warn_age: 7

# set sugroup if differs from wheel
ubtu26cis_sugroup: nosugroup

# var log location variable
ubtu26cis_varlog_location: "/var/log/sudo.log"

# Section 6
ubtu26cis_config_aide: true

# 6.1.2.5 rsyslog remote offload server settings
# change as appropriate - must match ubtu26cis_remote_log_server in the
# remediation role defaults/main.yml, otherwise a standalone audit run tests a
# different loghost than the role configures.
ubtu26cis_remote_log_server: 192.168.2.100
ubtu26cis_remote_log_port: 514
ubtu26cis_remote_log_protocol: tcp

# 6.1.2
# aide setup via - cron, timer
ubtu26cis_aide_scan: timer
