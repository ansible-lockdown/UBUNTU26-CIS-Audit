---

{{ if .Vars.ubtu26cis_level_1 }}
  {{ if .Vars.ubtu26cis_rule_3_3_1_19 }}
    kernel-param:
      net.ipv4.conf.all.route_localnet:
        title: 3.3.1.19 | Ensure net.ipv4.conf.all.route_localnet is configured
        value: '0'
        meta:
          server: 1
          workstation: 1
          CIS_ID:
          - 3.3.1.19
          NIST800-53R5:
          - CM-1
          - CM-2
          - CM-6
          - CM-7
          - IA-5
    command:
      ipv4_route_localnet:
        title: 3.3.1.19 | Ensure net.ipv4.conf.all.route_localnet is configured | conf
        exec: grep "net\.ipv4\.conf\.all\.route_localnet" $([ -f /etc/sysctl.conf ] && echo /etc/sysctl.conf) /etc/sysctl.d/*
        exit-status:
          or:
          - 0
          - 1
        stdout:
        - '/net\.ipv4\.conf\.all\.route_localnet\s*=\s*0/'
        meta:
          server: 1
          workstation: 1
          CIS_ID:
          - 3.3.1.19
          NIST800-53R5:
          - CM-1
          - CM-2
          - CM-6
          - CM-7
          - IA-5
    {{ end }}
{{ end }}
