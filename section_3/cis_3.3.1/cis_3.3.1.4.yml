---

{{ if .Vars.ubtu26cis_level_1 }}
  {{ if not .Vars.ubtu26cis_is_router }}
    {{ if .Vars.ubtu26cis_rule_3_3_1_4 }}
      kernel-param:
        net.ipv4.conf.all.send_redirects:
          title: 3.3.1.4 | Ensure net.ipv4.conf.all.send_redirects is configured
          value: '0'
          meta:
            server: 1
            workstation: 1
            CIS_ID:
            - 3.3.1.4
            NIST800-53R5:
            - CM-1
            - CM-2
            - CM-6
            - CM-7
            - IA-5
      command:
        ipv4_all_send_redirects:
          title: 3.3.1.4 | Ensure net.ipv4.conf.all.send_redirects is configured | conf
          exec: grep "net\.ipv4\.conf\.all\.send_redirects" $([ -f /etc/sysctl.conf ] && echo /etc/sysctl.conf) /etc/sysctl.d/*
          exit-status:
            or:
            - 0
            - 1
          stdout:
          - '/net\.ipv4\.conf\.all\.send_redirects\s*=\s*0/'
          meta:
            server: 1
            workstation: 1
            CIS_ID:
            - 3.3.1.4
            NIST800-53R5:
            - CM-1
            - CM-2
            - CM-6
            - CM-7
            - IA-5
      {{ end }}
    {{ end }}
{{ end }}
