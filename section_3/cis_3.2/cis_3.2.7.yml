---

{{ if .Vars.ubtu26cis_level_2 }}
  {{ if .Vars.ubtu26cis_rule_3_2_7 }}
command:
  unneeded_network_protocol_modules:
    title: 3.2.7 | Ensure unneeded network protocol kernel modules are not available
    exit-status: 0
    exec: |-
      lsmod | awk '{print $1}' | grep -Ff <(find /lib/modules/"$(uname -r)"/kernel/net -type f -name '*.ko*' -printf '%f\n' 2>/dev/null | sed -E 's/\.ko(\.[xg]z|\.zst)?$//' | sort -u) || true
    stdout:
    - '!/.+/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 3.2.7
      NIST800-53R5: NA
  {{ end }}
{{ end }}
