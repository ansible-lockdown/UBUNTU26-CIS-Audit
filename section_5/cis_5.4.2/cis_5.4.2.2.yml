---

{{ if .Vars.ubtu26cis_level_1 }}
  {{ if .Vars.ubtu26cis_rule_5_4_2_2 }}
command:
  root_only_gid_0:
    title: 5.4.2.2 | Ensure root is the only GID 0 account
    skip: {{ not .Vars.ubtu26cis_disruption_high }}
    skip-reason: ubtu26cis_disruption_high is false, the role does not change existing accounts
    exec: |
      awk -F: '($4 == 0 && $1 == "root") {print "root_ok"} ($4 == 0 && $1 != "root" && $1 !~ /^(sync|shutdown|halt|operator)$/) {print "FAIL: " $1}' /etc/passwd
    exit-status: 0
    stdout:
    - '/^root_ok$/'
    - '!/^FAIL:/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.4.2.2
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
