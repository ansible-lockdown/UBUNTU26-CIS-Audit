---


{{ if .Vars.ubtu26cis_level_1 }}
  {{ if .Vars.ubtu26cis_rule_5_4_2_6 }}
command:
  root_umask_bash_profile:
    title: 5.4.2.6 | Ensure root user umask is configured
    exec: |
      grep -PHsi -- '^\h*umask\h+((\d{1,2}(\d[^7]|[^2-7]\d)\b)|(u=[rwx]{1,3},)?(((g=[rx]?[rx]?w[rx]?[rx]?\b)(,o=[rwx]{1,3})?)|((g=[wrx]{1,3},)?o=[wrx]{1,3}\b)))' /root/.bash_profile /root/.profile /root/.bashrc | sed 's/^/FAIL: /'
      echo "scan_done"
    exit-status: 0
    stdout:
    - '/^scan_done$/'
    - '!/^FAIL:/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.4.2.6
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}

