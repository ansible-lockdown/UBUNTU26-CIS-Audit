---

{{ if .Vars.ubtu26cis_level_1 }}
  {{ if .Vars.ubtu26cis_rule_5_1_5 }}
file:
  sshd_access_limited:
    title: 5.1.5 | Ensure sshd access is configured
    path: /etc/ssh/sshd_config
    exists: true
    contents:
    {{ if .Vars.ubtu26cis_sshd_allow_users }}
    - {{ .Vars.ubtu26cis_sshd_allow_users }}
    {{ end }}
    {{ if .Vars.ubtu26cis_sshd_allow_groups }}
    - {{ .Vars.ubtu26cis_sshd_allow_groups }}
    {{ end }}
    {{ if .Vars.ubtu26cis_sshd_deny_users }}
    - {{ .Vars.ubtu26cis_sshd_deny_users }}
    {{ end }}
    {{ if .Vars.ubtu26cis_sshd_deny_groups }}
    - {{ .Vars.ubtu26cis_sshd_deny_groups }}
    {{ end }}
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.5
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
