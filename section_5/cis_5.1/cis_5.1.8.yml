---

{{ if .Vars.ubtu26cis_level_1 }}
  {{ if .Vars.ubtu26cis_rule_5_1_8 }}
command:
  sshd_clientalive:
    title: 5.1.8 | Ensure sshd ClientAliveInterval and ClientAliveCountMax are configured
    exec: sshd -T 2>/dev/null | grep -Ei '^(clientaliveinterval|clientalivecountmax) '
    exit-status: 0
    stdout:
    - '/^clientaliveinterval [1-9][0-9]*$/'
    - '/^clientalivecountmax [1-9][0-9]*$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.8
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
