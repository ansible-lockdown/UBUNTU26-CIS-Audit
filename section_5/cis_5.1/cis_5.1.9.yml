---

{{ if .Vars.ubtu26cis_level_1 }}
  {{ if .Vars.ubtu26cis_rule_5_1_9 }}
command:
  sshd_disableforwarding:
    title: 5.1.9 | Ensure sshd DisableForwarding is enabled
    exec: sshd -T 2>/dev/null | grep -Ei '^(disableforwarding) '
    exit-status: 0
    stdout:
    - '/^disableforwarding yes$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.9
      NIST800-53R5:
      - CM-7
  {{ end }}
{{ end }}
