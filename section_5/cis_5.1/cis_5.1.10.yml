---

{{ if .Vars.ubtu26cis_level_1 }}
  {{ if .Vars.ubtu26cis_rule_5_1_10 }}
command:
  sshd_gssapiauth:
    title: 5.1.10 | Ensure sshd GSSAPIAuthentication is disabled
    exec: sshd -T 2>/dev/null | grep -Ei '^(gssapiauthentication) '
    exit-status: 0
    stdout:
    - '/^gssapiauthentication no$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.10
      NIST800-53R5:
      - CM-7
  {{ end }}
{{ end }}
