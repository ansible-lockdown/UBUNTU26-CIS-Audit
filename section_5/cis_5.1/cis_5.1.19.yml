---

{{ if .Vars.ubtu26cis_level_1 }}
  {{ if .Vars.ubtu26cis_rule_5_1_19 }}
command:
  ssh_maxsessions:
    title: 5.1.19 | Ensure sshd MaxSessions is configured
    exec: sshd -T 2>/dev/null | grep -Ei '^(maxsessions) '
    exit-status: 0
    stdout:
    - '/^maxsessions ([1-9]|10)$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.19
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
