---

{{ if .Vars.ubtu26cis_level_1 }}
  {{ if .Vars.ubtu26cis_rule_5_1_11 }}
command:
  ssh_hostbased_auth:
    title: 5.1.11 | Ensure sshd HostbasedAuthentication is disabled
    exec: sshd -T 2>/dev/null | grep -Ei '^(hostbasedauthentication) '
    exit-status: 0
    stdout:
    - '/^hostbasedauthentication no$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.11
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
