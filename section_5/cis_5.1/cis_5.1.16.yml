---

{{ if .Vars.ubtu26cis_level_1 }}
  {{ if .Vars.ubtu26cis_rule_5_1_16 }}
command:
  ssh_loglevel:
    title: 5.1.16 | Ensure sshd LogLevel is configured
    exec: sshd -T 2>/dev/null | grep -Ei '^(loglevel) '
    exit-status: 0
    stdout:
    - '/^loglevel (VERBOSE|INFO)$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.16
      NIST800-53R5:
      - AU-3
      - AU-12
      - SI-5
 {{ end }}
{{ end }}
