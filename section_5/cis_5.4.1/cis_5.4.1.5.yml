---

{{ if .Vars.ubtu26cis_level_1 }}
  {{ if .Vars.ubtu26cis_rule_5_4_1_5 }}
command:
  inactive_passwd:
    title: 5.4.1.5 | Ensure inactive password lock is configured | password
    exec: useradd -D | grep INACTIVE
    exit-status: 0
    stdout:
    - '/^INACTIVE=([1-9]|[1-3][0-9]|4[0-5])$/'
    - '!/INACTIVE=(-1|4[6-9]|[5-9][0-9]{1,})/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.4.1.5
      NIST800-53R5: NA
  inactive_users:
    title: 5.4.1.5 | Ensure inactive password lock is configured | users
    skip: {{ not .Vars.ubtu26cis_disruption_high }}
    skip-reason: ubtu26cis_disruption_high is false, the role does not change existing accounts
    exec: |
      awk -F: -v l_max='{{ .Vars.ubtu26cis_pass_inactive }}' -v l_skip_root='{{ if .Vars.ubtu26cis_uses_root }}1{{ else }}0{{ end }}' 'BEGIN { if (l_max !~ /^[0-9]+$/ || l_max + 0 > 45) l_max = 45 } ($2 ~ /^\$.+\$/ && !(l_skip_root == 1 && $1 == "root")) { if ($7 == "" || $7 + 0 > l_max + 0 || $7 + 0 < 0) print "FAIL: " $1 " INACTIVE: " $7 }' /etc/shadow
      echo "scan_done"
    exit-status: 0
    stdout:
    - '/^scan_done$/'
    - '!/^FAIL:/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.4.1.5
      NIST800-53R5: NA
  {{ end }}
{{ end }}
