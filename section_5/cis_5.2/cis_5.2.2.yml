---

{{ if .Vars.ubtu26cis_level_1 }}
  {{ if .Vars.ubtu26cis_rule_5_2_2 }}
file:
  sudoers_use_pty:
    title: 5.2.2 | Ensure sudo commands use pty | Config
    path: /etc/sudoers
    exists: true
    contents:
    - '/^Defaults.*\suse_pty/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.2.2
      NIST800-53R5:
      - AC-6
command:
  pty_sudoers_d:
    title: 5.2.2 | Ensure sudo commands use pty | sudoers.d
    exec: "grep -rhEs '^\\s*Defaults\\s+([^#]+,\\s*)?!use_pty' /etc/sudoers /etc/sudoers.d/; true"
    exit-status: 0
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.2.2
      NIST800-53R5:
      - AC-6
  {{ end }}
{{ end }}
