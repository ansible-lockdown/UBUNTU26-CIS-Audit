---

{{ if .Vars.ubtu26cis_level_1 }}
  {{ if .Vars.ubtu26cis_rule_5_2_6 }}
command:
  sudo_timeout:
    title: 5.2.6 | Ensure sudo timestamp_timeout is configured
    exec: |
      grep -rhoPsi -- '^\h*Defaults\h+([^#\n\r]+,\h*)?timestamp_timeout\h*=\h*\K-?[0-9.]+' /etc/sudoers /etc/sudoers.d/ | awk '{ print "timeout_set" } ($1 < 0 || $1 > 15) { print "FAIL: timestamp_timeout=" $1 }'
      echo "scan_done"
    exit-status: 0
    stdout:
    - '/^timeout_set$/'
    - '/^scan_done$/'
    - '!/^FAIL:/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.2.6
      NIST800-53R5:
      - AC-6
  {{ end }}
{{ end }}
