---

{{ if .Vars.ubtu26cis_level_1 }}
  {{ if .Vars.ubtu26cis_rule_5_2_7 }}
file:
  su_conf:
    title: 5.2.7 | Ensure access to the su command is restricted
    path: /etc/pam.d/su
    exists: true
    contents:
    - '/^auth\s+required\s+pam_wheel.so use_uid group={{ .Vars.ubtu26cis_sugroup }}/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.2.7
      NIST800-53R5:
      - AC-6
command:
  sugroup_etc_group:
    title: 5.2.7 | Ensure access to the su command is restricted
    exec: awk -F':' -v g="{{ .Vars.ubtu26cis_sugroup }}" '$1 == g {print $NF}' /etc/group
    exit-status: 0
    stdout:
    - '!/^[a-zA-Z]/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.2.7
      NIST800-53R5:
      - AC-6
  {{ end }}
{{ end }}
