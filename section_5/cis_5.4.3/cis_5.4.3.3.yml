---

{{ if .Vars.ubtu26cis_level_1 }}
  {{ if .Vars.ubtu26cis_rule_5_4_3_3 }}
command:
  umask_profile_scripts:
    title: 5.4.3.3 | Ensure default user umask is configured
    exec: |
      grep -PHsi -- '^\h*umask\h+(?!(0?[0-7][2367]7|u=[rwx]{0,3},g=[rx]{0,2},o=)([\h#;]|$))' /etc/profile /etc/profile.d/*.sh | sed 's/^/FAIL: /'
      grep -PHsi -- '^\h*UMASK\h+(?!0?[0-7][2367]7([\h#;]|$))' /etc/login.defs | sed 's/^/FAIL: /'
      grep -Psiq -- '^\h*umask\h+(0?[0-7][2367]7|u=[rwx]{0,3},g=[rx]{0,2},o=)([\h#;]|$)' /etc/profile /etc/profile.d/*.sh && echo "umask_set"
      echo "scan_done"
    exit-status: 0
    stdout:
    - '/^umask_set$/'
    - '/^scan_done$/'
    - '!/^FAIL:/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.4.3.3
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
