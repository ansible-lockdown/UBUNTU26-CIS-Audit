---

# Oldest syver this content needs; unknown top-level keys are errors
syver-version: 0.20.0

# Host facts that decide whether a test applies; the test is skipped with a reason when it does not
# Partitions the role only checks when they exist (1.1.2.3 - 1.1.2.7 mount options)
discovery:
  mount:
    /home:
      register: home_mounted
      exists: true
    /var:
      register: var_mounted
      exists: true
    /var/tmp:
      register: var_tmp_mounted
      exists: true
    /var/log:
      register: var_log_mounted
      exists: true
    /var/log/audit:
      register: var_log_audit_mounted
      exists: true
  package:
    # 1.5.7 /etc/default/apport is only checked when apport is installed
    apport:
      register: apport_installed
      installed: true
    # 1.7.7 WaylandEnable=false is only set when an X11 (Xorg) session is installed
    xserver-xorg-core:
      register: xorg_installed
      installed: true
    # 2.1.1 autofs.service is only checked for masked when autofs is installed
    autofs:
      register: autofs_installed
      installed: true
  # 7.1.10 opasswd files the benchmark says may not exist
  file:
    /etc/security/opasswd:
      register: opasswd_exists
      exists: true
    /etc/security/opasswd.old:
      register: opasswd_old_exists
      exists: true

syverfile:
# Section 1
  {{ if .Vars.ubtu26cis_section1 }}
  section_1/*/*.yml: {}
  {{ end }}

# Section 2
  {{ if .Vars.ubtu26cis_section2 }}
  # Special Services
  section_2/cis_2.1/*.yml: {}
  # Client Service
  section_2/cis_2.2/*.yml: {}
  # Time services
  section_2/cis_2.3/*.yml: {}
  # scheduling services
  section_2/cis_2.4/*.yml: {}
  {{ end }}

# Section 3
  {{ if .Vars.ubtu26cis_section3 }}
  section_3/cis_3.1/*.yml: {}
  section_3/cis_3.2/*.yml: {}
  # IPv4 network kernel parameters
  section_3/cis_3.3.1/*.yml: {}
  # IPv6 network kernel parameters, skipped with a reason when ubtu26cis_ipv6_required is false
  section_3/cis_3.3.2/*.yml: {}
  {{ end }}

# Section 4 - Host Based Firewall (UFW only)
  {{ if .Vars.ubtu26cis_section4 }}
  section_4/cis_4.1/*.yml: {}
  {{ end }}

# Section 5
  {{ if .Vars.ubtu26cis_section5 }}
  section_5/*/*.yml: {}
  {{ end }}

# Section 6
  {{ if .Vars.ubtu26cis_section6 }}
  # Journald
  section_6/cis_6.1.1.1/*.yml: {}
  # Rsyslog
  {{ if eq .Vars.ubtu26cis_syslog_service "rsyslog" }}
  section_6/cis_6.1.2/*.yml: {}
  {{ end }}
  # Logfile access
  section_6/cis_6.1.3/*.yml: {}
  # Auditd - level 2 only
    {{ if .Vars.ubtu26cis_level_2 }}
  section_6/cis_6.2.*/*.yml: {}
    {{ end }}
  # Aide
  section_6/cis_6.3.*/*.yml: {}
  {{ end }}

# Section 7
  {{ if .Vars.ubtu26cis_section7 }}
  section_7/cis_7.*/*.yml: {}
  {{ end }}

# Metadata
command:
  benchmark_meta:
    title: Benchmark MetaData
    exec: echo BenchMark MetaData
    exit-status: 0
    meta:
      host_machine_uuid: {{ .Vars.machine_uuid }}
      host_epoch: {{ .Vars.epoch }}
      host_os_locale: {{ .Vars.os_locale }}
      host_os_release: {{ .Vars.os_release }}
      host_os_distribution: {{ .Vars.os_distribution }}
      host_automation_group: {{ .Vars.auto_group }}
      host_hostname: {{ .Vars.os_hostname }}
      host_system_type: {{ .Vars.system_type }}
      benchmark_type: {{ .Vars.benchmark_type }}
      benchmark_version: {{ .Vars.benchmark_version }}
      benchmark_os: {{ .Vars.benchmark_os }}
