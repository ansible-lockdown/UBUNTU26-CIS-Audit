---

{{ if .Vars.ubtu26cis_level_1 }}
  {{ if .Vars.ubtu26cis_rule_4_1_5 }}
command:
  ufw_routed_default:
    title: 4.1.5 | Ensure ufw routed default is configured
    exec: ufw status verbose | grep -Po '\S+(?= \(routed\))' ; grep -Po '^DEFAULT_FORWARD_POLICY="\K[A-Z]+' /etc/default/ufw
    exit-status: 0
    stdout:
    - '/^(deny|reject|disabled)$/'
    - '/^(DROP|REJECT)$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 4.1.5
      NIST800-53R5:
      - SC-7
  {{ end }}
{{ end }}
