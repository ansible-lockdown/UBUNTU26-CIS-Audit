---

{{ if .Vars.ubtu26cis_level_1 }}
  {{ if .Vars.ubtu26cis_rule_6_1_3_1 }}
command:
  logfile_configured:
    title: 6.1.3.1 | Ensure access to all logfiles has been configured
    exec: |
      l_ex='{{ range $i, $e := .Vars.ubtu26cis_logfile_perms_exclude }}{{ if $i }}|{{ end }}{{ $e }}{{ end }}'
      {
        find /var/log/ -type f \( -name 'lastlog' -o -name 'wtmp' -o -name 'btmp' \) -perm /g+x,o+wx -print
        find /var/log/ -type f \( -name 'secure' -o -name 'auth*' -o -name 'syslog' -o -name 'messages' \) -perm /u+x,g+wx,o+rwx -print
        find /var/log/ -type f \( -name 'SSSD' -o -name 'sssd' -o -name 'gdm*' \) -perm /ug+x,o+rwx -print
      } | while IFS= read -r l_file; do
        if [ -n "$l_ex" ] && printf '%s\n' "$l_file" | grep -Eq -- "$l_ex"; then
          continue
        fi
        echo "FAIL: $l_file $(stat -c '%a %U %G' "$l_file")"
      done
      echo "scan_done"
    exit-status: 0
    stdout:
    - '/^scan_done$/'
    - '!/^FAIL:/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.3.1
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
