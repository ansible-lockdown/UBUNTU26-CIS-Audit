---

{{ if .Vars.ubtu26cis_level_2 }}
  {{ if .Vars.ubtu26cis_rule_6_2_3_21 }}
command:
  auditd_21_config:
    title: 6.2.3.21 | Ensure successful file system mounts are collected | Config
    exec: grep mounts /etc/audit/rules.d/*.rules
    exit-status: 0
    stdout:
    - '-a always,exit -F arch=b64 -S mount -F auid>=1000 -F auid!=unset -k mounts'
    - '-a always,exit -F arch=b32 -S mount -F auid>=1000 -F auid!=unset -k mounts'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.21
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
