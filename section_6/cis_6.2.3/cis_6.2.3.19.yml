---

{{ if .Vars.ubtu26cis_level_2 }}
  {{ if .Vars.ubtu26cis_rule_6_2_3_19 }}
command:
  auditd_19_config:
    title: 6.2.3.19 | Ensure discretionary access control permission modification events chown,fchown,lchown,fchownat are collected | Config
    exec: grep perm_mod /etc/audit/rules.d/*.rules
    exit-status: 0
    stdout:
    - '-a always,exit -F arch=b64 -S chown,fchown,lchown,fchownat -F auid>=1000 -F auid!=unset -k perm_mod'
    - '-a always,exit -F arch=b32 -S chown,fchown,lchown,fchownat -F auid>=1000 -F auid!=unset -k perm_mod'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.19
      NIST800-53R5:
      - AC-3
      - AU-3
      - MP-2
  {{ end }}
{{ end }}
