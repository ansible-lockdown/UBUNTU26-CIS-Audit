---

{{ if .Vars.ubtu26cis_level_2 }}
  {{ if .Vars.ubtu26cis_rule_6_2_3_12 }}
command:
  auditd_12_config:
    title: 6.2.3.12 | Ensure events that modify /etc/group information are collected | Config
    exec: grep identity /etc/audit/rules.d/*.rules
    exit-status: 0
    stdout:
    - '-a always,exit -F arch=b64 -F path=/etc/group -F perm=wa -k identity'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.12
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
