---

{{ if .Vars.ubtu26cis_level_2 }}
  {{ if .Vars.ubtu26cis_rule_6_2_3_3 }}
command:
  auditd_3_config:
    title: 6.2.3.3 | Ensure events that modify the sudo log file are collected | Config
    exec: grep sudo_log_file /etc/audit/rules.d/*.rules
    exit-status: 0
    stdout:
    - '-a always,exit -F arch=b64 -F path={{ .Vars.ubtu26cis_varlog_location }} -F perm=wa -k sudo_log_file'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.3
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
