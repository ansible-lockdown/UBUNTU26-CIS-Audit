---

{{ if .Vars.ubtu26cis_level_2 }}
  {{ if .Vars.ubtu26cis_rule_6_2_3_9 }}
command:
  auditd_9_config:
    title: 6.2.3.9 | Ensure events that modify /etc/NetworkManager directory are collected | Config
    exec: grep system-locale /etc/audit/rules.d/*.rules
    exit-status: 0
    stdout:
    - '-w /etc/NetworkManager/ -p wa -k system-locale'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.9
      NIST800-53R5:
      - AU-3
      - CM-6
  {{ end }}
{{ end }}
