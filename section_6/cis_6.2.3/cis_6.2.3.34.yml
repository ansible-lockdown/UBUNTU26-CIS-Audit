---

{{ if .Vars.ubtu26cis_level_2 }}
  {{ if .Vars.ubtu26cis_rule_6_2_3_34 }}
command:
  auditd_load_on_error:
    title: 6.2.3.34 | Ensure the audit configuration is loaded regardless of errors
    exec: 'grep "^-c" /etc/audit/rules.d/*.rules'
    exit-status: 0
    stdout:
    - '-c'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.34
      NIST800-53R5:
      - AU-3
      - AU-12
  {{ end }}
{{ end }}
