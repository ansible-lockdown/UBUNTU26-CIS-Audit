---

{{ if .Vars.ubtu26cis_level_2 }}
  {{ if .Vars.ubtu26cis_rule_6_2_3_31 }}
command:
  auditd_31_config:
    title: 6.2.3.31 | Ensure kernel module loading unloading and modification is collected | Config
    exec: grep kernel_modules /etc/audit/rules.d/*.rules
    exit-status: 0
    stdout:
    - '-a always,exit -F arch=b64 -F path=/usr/bin/kmod -F perm=x -F auid>=1000 -F auid!=unset -k kernel_modules'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.31
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
