---

{{ if .Vars.ubtu26cis_level_2 }}
  {{ if .Vars.ubtu26cis_rule_6_2_3_22 }}
command:
  auditd_22_config:
    title: 6.2.3.22 | Ensure session initiation information is collected | Config
    exec: grep session /etc/audit/rules.d/*.rules
    exit-status: 0
    stdout:
    - '-a always,exit -F arch=b64 -F path=/var/run/utmp -F perm=wa -k session'
    - '-a always,exit -F arch=b64 -F path=/var/log/wtmp -F perm=wa -k session'
    - '-a always,exit -F arch=b64 -F path=/var/log/btmp -F perm=wa -k session'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.22
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
