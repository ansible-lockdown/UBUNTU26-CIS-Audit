---

{{ if .Vars.ubtu26cis_level_2 }}
  {{ if .Vars.ubtu26cis_rule_6_2_3_30 }}
command:
  auditd_30_config:
    title: 6.2.3.30 | Ensure successful and unsuccessful attempts to use the usermod command are collected | Config
    exec: grep usermod /etc/audit/rules.d/*.rules
    exit-status: 0
    stdout:
    - '-a always,exit -F path=/usr/sbin/usermod -F perm=x -F auid>=1000 -F auid!=-1 -k usermod'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.30
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
