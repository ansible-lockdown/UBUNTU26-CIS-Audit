---

{{ if .Vars.ubtu26cis_level_2 }}
  {{ if .Vars.ubtu26cis_rule_6_2_3_35 }}
command:
  auditd_immutable:
    title: 6.2.3.35 | Ensure the audit configuration is immutable
    exec: 'grep "-e 2" /etc/audit/rules.d/*.rules | cut -d ":" -f2'
    exit-status: 0
    stdout:
    - '-e 2'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.35
      NIST800-53R5:
      - AC-3
      - AU-3
      - AU-12
      - MP-2
  {{ end }}
{{ end }}
