---

{{ if .Vars.ubtu26cis_level_2 }}
  {{ if .Vars.ubtu26cis_rule_6_2_3_17 }}
command:
  auditd_17_config:
    title: 6.2.3.17 | Ensure events that modify /etc/pam.conf and /etc/pam.d/ information are collected | Config
    exec: grep identity /etc/audit/rules.d/*.rules
    exit-status: 0
    stdout:
    - '-a always,exit -F arch=b64 -F path=/etc/pam.conf -F perm=wa -k identity'
    - '-a always,exit -F arch=b64 -F dir=/etc/pam.d -F perm=wa -k identity'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.17
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
