---

{{ if .Vars.ubtu26cis_level_2 }}
  {{ if .Vars.ubtu26cis_rule_6_2_3_8 }}
command:
  auditd_8_config:
    title: 6.2.3.8 | Ensure events that modify the system's network environment are collected | Config
    exec: grep -h system-locale /etc/audit/rules.d/*.rules; [ -d /etc/network/interfaces.d ] || echo "interfaces.d not present"
    exit-status: 0
    stdout:
    - '-a always,exit -F arch=b64 -F path=/etc/network/interfaces -F perm=wa -k system-locale'
    - '/(dir=\/etc\/network\/interfaces\.d -F perm=wa -k system-locale|interfaces\.d not present)/'
    - '-a always,exit -F arch=b64 -F dir=/etc/netplan/ -F perm=wa -k system-locale'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.8
      NIST800-53R5:
      - AU-3
      - CM-6
  {{ end }}
{{ end }}
