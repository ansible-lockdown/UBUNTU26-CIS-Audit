---

{{ if .Vars.ubtu26cis_level_2 }}
  {{ if .Vars.ubtu26cis_rule_6_2_3_23 }}
command:
  auditd_23_config:
    title: 6.2.3.23 | Ensure login and logout events are collected | Config
    exec: grep logins /etc/audit/rules.d/*.rules
    exit-status: 0
    stdout:
    - '-w /var/log/lastlog -p wa -k logins'
    - '-w /var/run/faillock -p wa -k logins'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.23
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
