---

{{ if .Vars.ubtu26cis_level_2 }}
  {{ if .Vars.ubtu26cis_rule_6_2_3_10 }}
command:
  auditd_10_config:
    title: 6.2.3.10 | Ensure use of privileged commands are collected | Config
    exec: grep privileged /etc/audit/rules.d/*.rules
    # Note: audit rule uses discovered_privilege_processes at build time; check adapted to key-only match
    exit-status: 0
    stdout:
    - '-a always,exit -F path=<privileged_command> -F perm=x -F auid>=1000 -F auid!=unset -k privileged'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.10
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
