---

{{ if .Vars.ubtu26cis_level_2 }}
  {{ if .Vars.ubtu26cis_rule_6_2_3_32 }}
command:
  auditd_32_config:
    title: 6.2.3.32 | Ensure kernel "init_module" and "finit_module" loading unloading and modification is collected | Config
    exec: grep kernel_modules /etc/audit/rules.d/*.rules
    exit-status: 0
    stdout:
    - '-a always,exit -F arch=b64 -S init_module,finit_module -F auid>=1000 -F auid!=unset -k kernel_modules'
    - '-a always,exit -F arch=b32 -S init_module,finit_module -F auid>=1000 -F auid!=unset -k kernel_modules'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.32
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
