---

{{ if .Vars.ubtu26cis_level_2 }}
  {{ if .Vars.ubtu26cis_rule_6_2_3_25 }}
command:
  auditd_25_config:
    title: 6.2.3.25 | Ensure rename file deletion events by users are collected | Config
    exec: grep delete /etc/audit/rules.d/*.rules
    exit-status: 0
    stdout:
    - '-a always,exit -F arch=b64 -S rename,renameat -F auid>=1000 -F auid!=unset -k delete'
    - '-a always,exit -F arch=b32 -S rename,renameat -F auid>=1000 -F auid!=unset -k delete'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.25
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
