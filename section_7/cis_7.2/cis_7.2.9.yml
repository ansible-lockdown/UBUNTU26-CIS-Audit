---

{{ if .Vars.ubtu26cis_level_1 }}
  {{ if .Vars.ubtu26cis_rule_7_2_9 }}
command:
  home_dirs_exist:
    title: 7.2.9 | Ensure local interactive user home directories are configured | Directories exist
    exec: |
      valid=$(awk -F/ '$NF != "nologin" && /^\// {print}' /etc/shells)
      awk -F: '{print $1, $6, $7}' /etc/passwd | while read -r u h s; do
        printf '%s\n' "$valid" | grep -qxF -- "$s" || continue
        [ -d "$h" ] || echo "FAIL: home directory $h of $u does not exist"
      done
      echo "scan_done"
    exit-status: 0
    stdout:
    - '/^scan_done$/'
    - '!/^FAIL:/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 7.2.9
      NIST800-53R5: NA
  home_dirs_ownership:
    title: 7.2.9 | Ensure local interactive user home directories are configured | Directory ownership
    exec: |
      valid=$(awk -F/ '$NF != "nologin" && /^\// {print}' /etc/shells)
      awk -F: '{print $1, $6, $7}' /etc/passwd | while read -r u h s; do
        printf '%s\n' "$valid" | grep -qxF -- "$s" || continue
        [ -d "$h" ] && o=$(stat -Lc '%U' "$h") && [ "$o" != "$u" ] && echo "FAIL: home directory $h of $u is owned by $o"
      done
      echo "scan_done"
    exit-status: 0
    stdout:
    - '/^scan_done$/'
    - '!/^FAIL:/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 7.2.9
      NIST800-53R5: NA
  home_dirs_permissions:
    title: 7.2.9 | Ensure local interactive user home directories are configured | Directory permissions
    exec: |
      valid=$(awk -F/ '$NF != "nologin" && /^\// {print}' /etc/shells)
      awk -F: '{print $1, $6, $7}' /etc/passwd | while read -r u h s; do
        printf '%s\n' "$valid" | grep -qxF -- "$s" || continue
        [ -d "$h" ] && [ -n "$(find "$h" -maxdepth 0 -perm /027)" ] && echo "FAIL: home directory $h of $u is mode $(stat -Lc '%a' "$h")"
      done
      echo "scan_done"
    exit-status: 0
    stdout:
    - '/^scan_done$/'
    - '!/^FAIL:/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 7.2.9
      NIST800-53R5: NA
  {{ end }}
{{ end }}
