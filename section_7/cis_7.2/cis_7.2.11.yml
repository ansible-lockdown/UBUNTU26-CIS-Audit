---

{{ if .Vars.ubtu26cis_level_1 }}
  {{ if .Vars.ubtu26cis_rule_7_2_11 }}
command:
  dot_dir_perms:
    title: 7.2.11 | Ensure local interactive user dot directories access is configured | dot directory permissions
    exec: 'find /home/ -type d -name "\.*" ! -name ".ssh" -perm /g+w,o+rwx'
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 7.2.11
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  dot_ssh_dir_perms:
    title: 7.2.11 | Ensure local interactive user dot directories access is configured | .ssh directory permissions
    exec: 'find /home/ -type d -name ".ssh" -perm /go+rwx'
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 7.2.11
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
