---

{{ if eq .Vars.ubtu26cis_time_sync_tool "chrony" }}
  {{ if .Vars.ubtu26cis_level_1 }}
    {{ if .Vars.ubtu26cis_rule_2_3_3_2 }}
file:
  chrony_user:
    title: 2.3.3.2 | Ensure chrony is running as user _chrony
    path: /etc/chrony/chrony.conf
    exists: true
    contents:
    - '/^user _chrony/'
    meta:
      server: 1
      workstation: 1
      CIS_ID: 2.3.3.2
      NIST800-53R5:
      - AU-8
command:
  chronyd_process_user:
    title: 2.3.3.2 | Ensure chrony is running as user _chrony | chronyd process user
    exec: |
      ps -eo user=,comm= | awk '$2 == "chronyd" && $1 != "_chrony" {print "FAIL: chronyd is running as " $1}'
      echo "scan_done"
    exit-status: 0
    stdout:
    - '/^scan_done$/'
    - '!/^FAIL:/'
    meta:
      server: 1
      workstation: 1
      CIS_ID: 2.3.3.2
      NIST800-53R5:
      - AU-8
    {{ end }}
  {{ end }}
{{ end }}
