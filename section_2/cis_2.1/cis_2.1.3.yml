---

{{ if .Vars.ubtu26cis_level_1 }}
  {{ if .Vars.ubtu26cis_rule_2_1_3 }}
    {{ if not .Vars.ubtu26cis_dhcp_server }}
      {{ if not .Vars.ubtu26cis_dhcp_mask }}
package:
  dhcp_pkg_kea:
    title: 2.1.3 | Ensure dhcp server services are not in use | kea removed
    name: kea
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.3
      NIST800-53R5:
      - CM-7
  dhcp_pkg_dhcp4:
    title: 2.1.3 | Ensure dhcp server services are not in use | kea-dhcp4-server removed
    name: kea-dhcp4-server
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.3
      NIST800-53R5:
      - CM-7
  dhcp_pkg_dhcp6:
    title: 2.1.3 | Ensure dhcp server services are not in use | kea-dhcp6-server removed
    name: kea-dhcp6-server
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.3
      NIST800-53R5:
      - CM-7
  dhcp_pkg_ddns:
    title: 2.1.3 | Ensure dhcp server services are not in use | kea-dhcp-ddns-server removed
    name: kea-dhcp-ddns-server
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.3
      NIST800-53R5:
      - CM-7
      {{ end }}
      {{ if .Vars.ubtu26cis_dhcp_mask }}
file:
  dhcp_masked_dhcp4:
    title: 2.1.3 | Ensure dhcp server services are not in use | kea-dhcp4-server.service masked
    path: /etc/systemd/system/kea-dhcp4-server.service
    exists: true
    filetype: symlink
    linked-to: /dev/null
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.3
      NIST800-53R5:
      - CM-7
  dhcp_masked_dhcp6:
    title: 2.1.3 | Ensure dhcp server services are not in use | kea-dhcp6-server.service masked
    path: /etc/systemd/system/kea-dhcp6-server.service
    exists: true
    filetype: symlink
    linked-to: /dev/null
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.3
      NIST800-53R5:
      - CM-7
  dhcp_masked_ddns:
    title: 2.1.3 | Ensure dhcp server services are not in use | kea-dhcp-ddns-server.service masked
    path: /etc/systemd/system/kea-dhcp-ddns-server.service
    exists: true
    filetype: symlink
    linked-to: /dev/null
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.3
      NIST800-53R5:
      - CM-7
      {{ end }}
    {{ end }}
  {{ end }}
{{ end }}
