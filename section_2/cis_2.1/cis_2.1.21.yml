---

{{ if and (eq .Vars.system_type "Server") .Vars.ubtu26cis_level_2 }}
  {{ if .Vars.ubtu26cis_rule_2_1_21 }}
package:
  xwindow_pkg:
    title: 2.1.21 | Ensure X window server services are not in use | pkg removed
    skip: {{ if or .Vars.ubtu26cis_xwindow_server .Vars.ubtu26cis_desktop_required }}true{{ else }}false{{ end }}
    skip-reason: the X window server is required, ubtu26cis_xwindow_server or ubtu26cis_desktop_required is true
    name: xserver-common
    installed: false
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 2.1.21
      NIST800-53R5:
      - CM-11
  {{ end }}
{{ end }}
